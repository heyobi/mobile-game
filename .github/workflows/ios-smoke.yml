name: iOS simulator smoke test

# Builds a Release app for the simulator (JS bundled, no signing), launches it, and checks that it
# gets past the splash screen. Uploads a screenshot and the app's log as artifacts.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  smoke:
    name: Launch in iOS simulator
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Build for simulator (Release, autopilot)
        env:
          # Inlined by Metro: the app skips the menu and the autopilot plays a run.
          EXPO_PUBLIC_AUTOPLAY: '1'
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | tail -n 40

      - name: Boot simulator, install and launch
        run: |
          APP=$(find build/sim/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices available -j | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8')).devices;
            const all = Object.entries(d).filter(([k]) => k.includes('iOS')).flatMap(([, v]) => v);
            const pick = all.find((x) => /iPhone \d+ Pro$/.test(x.name)) || all.find((x) => x.name.startsWith('iPhone'));
            process.stdout.write(pick.udid);
          ")
          echo "Device $DEVICE, app $APP ($BUNDLE_ID)"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p smoke
          START=$(date '+%Y-%m-%d %H:%M:%S')
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          LOGQ='subsystem == "com.facebook.react.log" OR process == "'"$SCHEME"'"'
          xcrun simctl io "$DEVICE" recordVideo --codec h264 --force smoke/gameplay.mp4 &
          REC=$!
          sleep 8
          # Info-level logs are memory-only and get evicted, so read the startup log early.
          xcrun simctl spawn "$DEVICE" log show --start "$START" --style compact --info --debug --predicate "$LOGQ" > smoke/startup.log 2>&1 || true
          xcrun simctl io "$DEVICE" screenshot smoke/screen-08s.png
          sleep 12
          kill -INT $REC || true
          wait $REC || true
          xcrun simctl io "$DEVICE" screenshot smoke/screen-20s.png
          sleep 25
          xcrun simctl io "$DEVICE" screenshot smoke/screen-45s.png
          xcrun simctl spawn "$DEVICE" log show --start "$START" --style compact --info --debug --predicate "$LOGQ" > smoke/app.log 2>&1 || true
          cat smoke/startup.log >> smoke/app.log
          echo "--- JavaScript log ---"
          grep "javascript\]" smoke/app.log | cut -c1-300 | tail -n 60 || true
          if grep -q "Unhandled JS Exception" smoke/app.log; then
            echo "::error::Unhandled JS exception (see log above)."
            exit 1
          fi
          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "::error::App is not running after launch (crashed)."
            exit 1
          fi
          if ! grep -q "APP_READY" smoke/app.log; then
            echo "::error::App did not report APP_READY (stuck on splash or JS error)."
            exit 1
          fi
          echo "✓ App launched, reported APP_READY and survived 60s of autoplay"

      - name: Upload screenshot and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-smoke
          path: smoke/
          retention-days: 7
